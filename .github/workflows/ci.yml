name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `@limccn/menhir-core` is a `workspace:*` dependency. CI assembles the same
# layout the developer checkout uses:
#   workspace/
#   ├── pnpm-workspace.yaml
#   ├── menhir/        (sibling repo; @limccn/menhir-core lives in menhir/ts)
#   └── surface/       (this repo)
# Both repos are public; the workflow token can read them.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone-surface
        uses: actions/checkout@v4
        with:
          path: workspace/surface
      - name: Checkout menhir (@limccn/menhir-core)
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir
      - name: Checkout longstone lockfile ledger
        uses: actions/checkout@v4
        with:
          repository: limccn/longstone
          token: ${{ github.token }}
          path: ci
      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "surface"\n  - "menhir/ts"\nallowBuilds:\n  "esbuild": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: workspace/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The lockfile is the reviewed ledger in longstone/ci/lockfiles. A
      # missing or stale ledger fails the job; there is no non-frozen fallback.
      - name: Install from reviewed lockfile
        working-directory: workspace
        run: |
          cp ../ci/ci/lockfiles/longstone-surface-ci.yaml pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace
      - run: pnpm --filter @limccn/longstone-surface build
        working-directory: workspace
      - run: pnpm --filter @limccn/longstone-surface test
        working-directory: workspace
      - run: pnpm --filter @limccn/longstone-surface typecheck
        working-directory: workspace
      - run: npm pack --dry-run
        working-directory: workspace/surface
